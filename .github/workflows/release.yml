# Publishes a signed release to the Terraform Registry on every `v*` tag.
#
# goreleaser builds the cross-platform binaries, produces the
# `_SHA256SUMS` + GPG-signed `_SHA256SUMS.sig`, and attaches the
# terraform-registry-manifest.json — the exact artifact set the registry
# ingests. The public half of the signing key is registered on the
# `sazabi` public namespace; the private half + passphrase live in repo
# Actions secrets (source of truth: 1Password Engineering →
# "Sazabi Terraform Registry Signing Key (GPG)").
#
# Required repo secrets:
#   GPG_PRIVATE_KEY  - ASCII-armored private key
#   PASSPHRASE       - the key's passphrase
# (GPG_FINGERPRINT is derived from the imported key at run time.)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
